        /* ---- PREMIUM HERO (PSD Pages) ---- */
        .page-hero-premium {
            position: relative;
            min-height: 360px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #003366 0%, #004a99 45%, #001f42 100%);
            padding: 60px 0 80px;
        }
        .hero-premium-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .hero-gradient-layer {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(245,197,24,0.12) 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%);
        }
        .hero-particles {
            position: absolute;
            inset: 0;
        }
        .hero-particles span {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            animation: float-particle 8s infinite ease-in-out;
        }
        .hero-particles span:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; }
        .hero-particles span:nth-child(2) { top: 25%; left: 25%; animation-delay: 1s; width: 4px; height: 4px; }
        .hero-particles span:nth-child(3) { top: 70%; left: 15%; animation-delay: 2s; }
        .hero-particles span:nth-child(4) { top: 40%; left: 80%; animation-delay: 0.5s; }
        .hero-particles span:nth-child(5) { top: 60%; left: 70%; animation-delay: 1.5s; width: 8px; height: 8px; }
        .hero-particles span:nth-child(6) { top: 80%; left: 40%; animation-delay: 2.5s; }
        .hero-particles span:nth-child(7) { top: 30%; left: 90%; animation-delay: 3s; width: 5px; height: 5px; }
        .hero-particles span:nth-child(8) { top: 85%; left: 85%; animation-delay: 0.8s; }
        .hero-particles span:nth-child(9) { top: 50%; left: 5%; animation-delay: 1.8s; width: 7px; height: 7px; }
        .hero-particles span:nth-child(10) { top: 10%; left: 60%; animation-delay: 2.2s; }
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 1; }
        }
        .hero-accent-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 1px solid rgba(245,197,24,0.08);
            top: -150px;
            right: -100px;
        }
        .hero-accent-circle-2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            left: -50px;
            top: auto;
            right: auto;
            border-color: rgba(255,255,255,0.05);
        }
        .hero-premium-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-premium-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245,197,24,0.15);
            border: 1px solid rgba(245,197,24,0.3);
            color: #f5c518;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(6px);
        }
        .hero-premium-badge i { font-size: 0.9rem; }
        .hero-premium-title {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .hero-premium-subtitle {
            font-size: 1.15rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 24px;
        }
        .hero-premium-breadcrumb {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
        }
        .hero-premium-breadcrumb a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: color 0.3s;
        }
        .hero-premium-breadcrumb a:hover { color: #f5c518; }
        .hero-premium-breadcrumb i { font-size: 0.7rem; color: rgba(255,255,255,0.3); }
        .hero-premium-breadcrumb span { color: #f5c518; font-weight: 600; }
        .hero-wave-divider {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            line-height: 0;
            pointer-events: none;
        }
        .hero-wave-divider svg {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (max-width: 768px) {
            .page-hero-premium { min-height: 260px; padding: 40px 0 60px; }
            .hero-premium-title { font-size: 2rem; }
            .hero-premium-subtitle { font-size: 1rem; }
            .hero-accent-circle { width: 300px; height: 300px; top: -80px; right: -80px; }
