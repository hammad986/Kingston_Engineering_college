<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Kingston Engineering College</title>
    <meta name="description" content="Thank you for submitting your admission enquiry to Kingston Engineering College. Our admissions team will connect with you shortly.">
    <link rel="canonical" href="https://engineering.kingston.ac.in/thank_you.html">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003366 50%, #004b87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            color: #0f172a;
        }

        .thank-you-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .thank-icon-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
        }

        .thank-you-card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: #0f172a;
        }

        .thank-you-card p {
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .thank-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-thank-primary {
            background: #8b1a2b;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-thank-primary:hover {
            background: #002b5b;
            color: #ffffff;
        }

        .btn-thank-secondary {
            background: #f1f5f9;
            color: #334155;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-thank-secondary:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>

<body>
    <div class="thank-you-card">
        <div class="thank-icon-circle">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>Thank You!</h1>
        <p>Your admission enquiry has been successfully received by Kingston Engineering College. Our admissions counselling team will get in touch with you shortly.</p>
        
        <div class="thank-actions">
            <a href="/index.html" class="btn-thank-primary">
                <i class="fa-solid fa-house"></i> Go to Homepage
            </a>
            <a href="/landing.html" class="btn-thank-secondary">
                <i class="fa-solid fa-arrow-left"></i> Back to Form
            </a>
        </div>
    </div>
</body>

</html>
