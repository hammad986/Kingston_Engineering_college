<body>

    <div id="include-header"></div>

    <main>
        <!-- Page Hero -->
        <div class="blog-page-hero"
            style="background: linear-gradient(135deg, #003366 0%, #00509e 60%, #0072ce 100%); padding: 56px 0 48px; position: relative; overflow: hidden; color: #fff;">
            <div class="container" style="position: relative; z-index: 1;">
                <p class="blog-breadcrumb"
                    style="color: rgba(255,255,255,0.65); font-size: 0.85rem; margin-bottom: 16px;">
                    <a href="index.html" style="color: rgba(255,255,255,0.75); text-decoration: none;">Home</a> / News &
                    Announcements
                </p>
                <h1 style="color: #fff; font-size: 2.4rem; font-weight: 800; margin: 0 0 8px; letter-spacing: 1px;"><i
                        class="fa-solid fa-newspaper" style="font-size:1.8rem;margin-right:12px;opacity:0.85;"></i>News
                    &
                    Announcements</h1>
                <p style="color: rgba(255,255,255,0.8); font-size: 1rem; margin: 0;">Stay informed with the latest
                    updates, events, achievements and announcements from Kingston Engineering College.</p>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="blog-controls"
            style="background: #fff; border-bottom: 1px solid #e8edf5; padding: 18px 0; position: relative; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.07);">
            <div class="container blog-controls-inner"
                style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <div class="blog-search-wrap" style="position: relative; flex: 0 0 260px;">
                    <i class="fa-solid fa-magnifying-glass"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 0.85rem;"></i>
                    <input type="search" id="blog-search" placeholder="Search news…" autocomplete="off"
                        style="width: 100%; padding: 9px 14px 9px 34px; border: 1.5px solid #dde4f0; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; background: #f8faff;">
                </div>
                <div id="blog-filter-bar" style="display: flex; gap: 8px; flex-wrap: wrap; flex: 1;">
                    <!-- Populated by news.js -->
                </div>
            </div>
        </div>

        <!-- News Grid -->
        <section class="blog-news-section" style="padding: 48px 0 64px; background: #f4f7fb;">
            <div class="container">
                <div id="blog-news-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px;">
                    <!-- Populated by news.js -->
                    <div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#888;">
                        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#003366;"></i>
                        <p style="margin-top:16px;">Loading news…</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="include-footer"></div>
