    <style>
        /* =============================================
           TESTIMONIALS PAGE — DEDICATED STYLES
           ============================================= */

        /* ── Page Hero Banner ── */
        .testi-page-hero {
            background: linear-gradient(135deg, #002855 0%, #0a3a70 60%, #1a5490 100%);
            padding: 70px 0 60px;
            position: relative;
            overflow: hidden;
        }

        .testi-page-hero::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 340px;
            height: 340px;
            background: rgba(255, 193, 7, 0.06);
            border-radius: 50%;
        }

        .testi-page-hero::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 260px;
            height: 260px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
        }

        .testi-hero-inner {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .testi-hero-tag {
            display: inline-block;
            background: rgba(245, 197, 24, 0.15);
            color: #f5c518;
            border: 1px solid rgba(245, 197, 24, 0.3);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .testi-hero-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            color: #fff;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .testi-hero-subtitle {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.72);
            max-width: 560px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }

        .testi-hero-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            flex-wrap: wrap;
        }

        .testi-stat {
            text-align: center;
        }

        .testi-stat-num {
            display: block;
            font-size: 2rem;
            font-weight: 900;
            color: #f5c518;
            line-height: 1;
        }

        .testi-stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Filter Bar ── */
        .testi-filter-section {
            background: #fff;
            border-bottom: 1px solid #eaeef4;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .testi-filter-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
            margin-right: 6px;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1.5px solid #d0dce8;
            background: transparent;
            color: #445566;
            font-weight: 600;
            font-size: 0.83rem;
            cursor: pointer;
            transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease, transform 0.18s ease;
            white-space: nowrap;
            font-family: inherit;
        }

        @media (prefers-reduced-motion: no-preference) {
            .filter-btn:hover {
                background: #f0f4f9;
                border-color: #003366;
                color: #003366;
            }
        }

        .filter-btn.active {
            background: #003366;
            color: #fff;
            border-color: #003366;
        }

        .testi-count-badge {
            font-size: 0.75rem;
            background: #f0f4f9;
            color: #003366;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
            margin-left: auto;
        }

        /* ── Grid ── */
        .testi-page-section {
            padding: 60px 0 80px;
            background: #f5f7fb;
            min-height: 500px;
        }

        .testi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        /* ── Page Card (Richer than slider card) ── */
        .testi-page-card {
            background: #fff;
            border-radius: 18px;
            padding: 28px 24px 26px;
            box-shadow: 0 4px 20px rgba(0, 34, 85, 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0, 51, 102, 0.07);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .testi-page-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #003366, #0a4a8f);
            border-radius: 18px 18px 0 0;
        }

        @media (prefers-reduced-motion: no-preference) {
            .testi-page-card:hover {
                transform: translateY(-6px);
                box-shadow: 0 16px 40px rgba(0, 34, 85, 0.13);
                border-color: rgba(0, 51, 102, 0.15);
            }
        }

        .testi-page-logos-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 22px;
            min-height: 64px;
            background: #f4f7fb;
            border-radius: 12px;
            padding: 10px 16px;
        }

        .testi-page-clg-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .testi-page-comp-logo {
            max-width: 130px;
            height: 52px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        @media (prefers-reduced-motion: no-preference) {

            .testi-page-card:hover .testi-page-clg-logo,
            .testi-page-card:hover .testi-page-comp-logo {
                transform: scale(1.05);
            }

            .testi-page-card:hover .testi-page-photo-wrap img {
                transform: scale(1.07);
            }
        }

        .testi-page-photo-wrap {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #003366;
            margin: 0 auto 20px;
            flex-shrink: 0;
            background: #e8edf5;
            box-shadow: 0 6px 22px rgba(0, 51, 102, 0.22);
        }

        .testi-page-photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .testi-page-name {
            font-weight: 800;
            font-size: 1.05rem;
            color: #002855;
            margin-bottom: 4px;
        }

        .testi-page-designation {
            font-size: 0.77rem;
            font-weight: 700;
            color: #0a4a8f;
            margin-bottom: 4px;
        }

        .testi-page-meta {
            font-size: 0.76rem;
            color: #8899aa;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .testi-page-dept-badge {
            display: inline-block;
            background: #eef2ff;
            color: #3355aa;
            border: 1px solid #d0dbf5;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .testi-page-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #003366, #0a4a8f);
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        .testi-page-quote {
            font-size: 0.87rem;
            color: #445566;
            line-height: 1.7;
            font-style: italic;
            position: relative;
            padding-top: 4px;
        }

        .testi-page-quote::before {
            content: '\201C';
            font-size: 3rem;
            color: #003366;
            opacity: 0.10;
            position: absolute;
            top: -12px;
            left: -4px;
            line-height: 1;
            font-style: normal;
        }

        /* ── Empty State ── */
        .testi-empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            display: none;
        }

        .testi-empty-state.visible {
            display: block;
        }

        .testi-empty-icon {
            font-size: 3.5rem;
            color: #c5d0e0;
            margin-bottom: 20px;
        }

        .testi-empty-state h3 {
            font-size: 1.3rem;
            color: #667788;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .testi-empty-state p {
            font-size: 0.9rem;
            color: #8899aa;
        }

        /* ── Responsive Adjustments ── */
        @media (max-width: 768px) {
            .testi-hero-stats {
                gap: 28px;
            }

            .testi-filter-inner {
                gap: 8px;
            }

            .filter-btn {
                font-size: 0.78rem;
                padding: 7px 14px;
            }

            .testi-grid {
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }
        }

        @media (max-width: 480px) {
            .testi-grid {
                grid-template-columns: 1fr;
            }

            .testi-hero-stats {
                gap: 16px;
            }
        }
    </style>
    <!-- Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/typography.css">
</head>

<body>

    <div id="include-header"></div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-video-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="assets/videos/main.mp4" type="video/mp4">
            </video>
            <div class="hero-overlay"></div>
        </div>

        <!-- Absolute Top Bar for College Info & TNEA inside Hero -->
        <div class="hero-top-panel container" data-aos="fade-down">
            <div class="hero-college-brand"></div>
        </div>

    </section>

    <!-- ================================================================
             FILTER BAR (Sticky)
             ================================================================ -->
    <div class="testi-filter-section" role="navigation" aria-label="Filter testimonials by department">
        <div class="container testi-filter-inner">
            <span class="filter-label">Filter:</span>
            <button class="filter-btn active" data-dept="all" id="filter-all">All</button>
            <button class="filter-btn" data-dept="CSE" id="filter-cse">CSE</button>
            <button class="filter-btn" data-dept="IT" id="filter-it">IT</button>
            <button class="filter-btn" data-dept="ECE" id="filter-ece">ECE</button>
            <button class="filter-btn" data-dept="Mechanical" id="filter-mech">Mechanical</button>
            <button class="filter-btn" data-dept="EEE" id="filter-eee">EEE</button>
            <button class="filter-btn" data-dept="MBA" id="filter-mba">MBA</button>
            <span class="testi-count-badge" id="testi-count-badge" aria-live="polite">23 results</span>
        </div>
    </div>

    <!-- ================================================================
             TESTIMONIALS GRID
             ================================================================ -->
    <section class="testi-page-section" aria-labelledby="grid-heading">
        <div class="container">
            <h2 id="grid-heading" style="display:none;">Alumni Testimonials Grid</h2>
            <div class="testi-grid" id="testi-grid" role="list" aria-label="Testimonials">
                <!-- Populated dynamically by testimonials.js -->
                <div id="testi-loading" style="grid-column:1/-1;text-align:center;padding:60px 0;color:#8899aa;">
                    <i class="fa-solid fa-spinner fa-spin"
                        style="font-size:2rem;margin-bottom:12px;display:block;color:#003366;"></i>
                    Loading testimonials…
                </div>
            </div>
        </div>
    </section>

    <div id="include-footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" integrity="sha384-2UI1PfnXFjVMQ7/ZDEF70CR943oH3v6uZrFQGGqJYlvhh4g6z6uVktxYbOlAczav" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" integrity="sha384-wziAfh6b/qT+3LrqebF9WeK4+J5sehS6FA10J1t3a866kJ/fvU5UwofWnQyzLtwu" crossorigin="anonymous"></script>
    <script src="assets/js/news.js" defer></script>
    <script src="assets/js/events.js" defer></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/ai-assistant.js" defer></script>

    <script src="assets/js/include-components.js"></script>
</body>
