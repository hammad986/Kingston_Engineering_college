<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Tour - Kingston Engineering College</title>
    <link rel="canonical" href="https://engineering.kingston.ac.in/campus_tour.html">
    <meta name="description" content="Campus Tour at Kingston Engineering College, Vellore. AICTE approved, Anna University affiliated, NAAC A grade autonomous institution in Vellore.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" integrity="sha384-/rJKQnzOkEo+daG0jMjU1IwwY9unxt1NBw3Ef2fmOJ3PW/TfAg2KXVoWwMZQZtw9" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/ai-assistant.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <style>
        .uc-section {
            padding: 120px 0;
            background: #f4f7f6;
            text-align: center;
            min-height: 60vh;
            display: flex;
            align-items: center;
        }
        .uc-icon-wrap {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 51, 102, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 3.2rem;
            color: #003366;
            animation: ucPulse 3s ease-in-out infinite;
        }
        @keyframes ucPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.75; }
        }
        .uc-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #003366;
            margin-bottom: 16px;
        }
        .uc-sub {
            font-size: 1.15rem;
            color: #666;
            max-width: 560px;
            margin: 0 auto 10px;
            line-height: 1.8;
        }
        .uc-note {
            font-size: 0.95rem;
            color: #999;
            margin-top: 24px;
        }
        .uc-note i {
            color: #f5c518;
            margin-right: 6px;
        }
        @media (max-width: 768px) {
            .uc-section { padding: 80px 0; }
            .uc-title { font-size: 2rem; }
            .uc-icon-wrap { width: 90px; height: 90px; font-size: 2.4rem; }
        }
    </style>
</head>
<body>
    <div id="include-header"></div>

    <section class="uc-section">
        <div class="container" data-aos="fade-up">
            <div class="uc-icon-wrap" data-aos="zoom-in" data-aos-delay="100">
                <i class="fa-solid fa-vr-cardboard"></i>
            </div>
            <h1 class="uc-title" data-aos="fade-up" data-aos-delay="200">Campus Tour</h1>
            <p class="uc-sub" data-aos="fade-up" data-aos-delay="300">
                Our interactive virtual campus tour is currently under development.
            </p>
            <p class="uc-sub" data-aos="fade-up" data-aos-delay="350">
                It will be available soon with a complete immersive experience.
            </p>
            <p class="uc-note" data-aos="fade-up" data-aos-delay="400">
                <i class="fa-solid fa-clock"></i> Expected launch: Academic Year 2026&ndash;27
            </p>
        </div>
    </section>

    <div id="include-footer"></div>

    <script src="assets/js/include-components.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" integrity="sha384-wziAfh6b/qT+3LrqebF9WeK4+J5sehS6FA10J1t3a866kJ/fvU5UwofWnQyzLtwu" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 800, easing: 'ease-in-out', once: true, offset: 50 });
            }
        });
    </script>
</body>
</html>
